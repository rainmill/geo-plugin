[package]
name = "rainmill-geo"
version = "0.1.0"
description = "Spatial queries for Laterite: shapes and points, point-in-polygon, nearest and within-radius, area and distance, GeoJSON and WKT"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/rainmill/geo-plugin"

# Marks this crate as a Laterite plugin and names the module it registers, so a
# tool can tell what it is without building it. Which Laterite it supports is
# stated by the dependency requirement below, never repeated here.
[package.metadata.laterite]
plugin = "rainmill.geo"

[dependencies]
# Laterite is unpublished and consumed by path in development (a Laterite
# checkout sits beside this repo); the version is emitted when publishing.
laterite-core = { path = "../laterite/crates/core", version = "0.11" }
# Text timestamps on stored shapes (the framework stores times as ISO strings).
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[dev-dependencies]
# Tests run against a real Postgres+PostGIS (this plugin requires PostGIS, so it
# cannot use the SQLite harness). The postgres feature compiles in the driver so
# the Any pool can reach Postgres; tests self-skip when no Postgres URL is set.
laterite-core = { path = "../laterite/crates/core", features = ["postgres"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
uuid = { version = "1", features = ["v4"] }
